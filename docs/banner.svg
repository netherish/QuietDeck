<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="QuietDeck banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="0.55" stop-color="#0B1222"/>
      <stop offset="1" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.55" stop-color="#FFB300"/>
      <stop offset="1" stop-color="#FF6B6B"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18223A"/>
      <stop offset="1" stop-color="#0D1424"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#FFB300" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle cx="130" cy="40" r="260" fill="url(#glowA)"/>
  <circle cx="1090" cy="330" r="300" fill="url(#glowB)"/>

  <g opacity="0.22" stroke="#263552" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200"/>
    <path d="M200 0V400M400 0V400M600 0V400M800 0V400M1000 0V400"/>
  </g>

  <g transform="translate(86 60)">
    <rect width="470" height="280" rx="28" fill="url(#card)" stroke="#263552"/>
    <rect x="24" y="24" width="422" height="6" rx="3" fill="url(#ring)"/>
    <text x="24" y="72" fill="#9FB3D1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">SYSTEM SOUND CONSOLE</text>
    <text x="24" y="126" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800">QuietDeck</text>
    <text x="24" y="166" fill="#9FB3D1" font-family="Segoe UI, Arial, sans-serif" font-size="19">See it. Shape it. Silence it.</text>
    <g transform="translate(24 205)">
      <rect width="108" height="38" rx="19" fill="#00E5FF" fill-opacity="0.16" stroke="#00E5FF"/>
      <text x="54" y="25" text-anchor="middle" fill="#00E5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">DND DIAL</text>
      <rect x="118" width="108" height="38" rx="19" fill="#FFB300" fill-opacity="0.16" stroke="#FFB300"/>
      <text x="172" y="25" text-anchor="middle" fill="#FFB300" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">PRESETS</text>
      <rect x="236" width="108" height="38" rx="19" fill="#7BE495" fill-opacity="0.16" stroke="#7BE495"/>
      <text x="290" y="25" text-anchor="middle" fill="#7BE495" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">QS TILE</text>
    </g>
  </g>

  <g transform="translate(720 48)">
    <rect width="250" height="304" rx="34" fill="#0D1424" stroke="#263552" stroke-width="2"/>
    <rect x="96" y="16" width="58" height="8" rx="4" fill="#263552"/>
    <text x="125" y="64" text-anchor="middle" fill="#9FB3D1" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURRENT STATE</text>
    <path d="M45 170 A80 80 0 1 1 205 170" fill="none" stroke="#263552" stroke-width="14" stroke-linecap="round"/>
    <path d="M45 170 A80 80 0 0 1 160 96" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round"/>
    <text x="125" y="158" text-anchor="middle" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">Priority</text>
    <text x="125" y="184" text-anchor="middle" fill="#7BE495" font-family="Segoe UI, Arial, sans-serif" font-size="14">Vibrate</text>
    <rect x="28" y="224" width="194" height="46" rx="14" fill="#18223A" stroke="#263552"/>
    <text x="125" y="253" text-anchor="middle" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Work</text>
  </g>
</svg>
